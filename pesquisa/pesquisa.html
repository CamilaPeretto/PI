<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa de Livros</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#E0F2F1]">

  <!-- Header -->
  <nav class="w-full bg-white shadow-md">
    <div class="w-full md:max-w-[1450px] mx-auto flex items-center justify-between px-2 md:px-[52px] py-3 md:py-4">
      <a href="../home/home.html" class="flex-shrink-0">
        <img src="../img/logo-Photoroom-home.png" alt="Logo InBook" class="w-28 md:w-48">
      </a>

      <div class="flex items-center gap-2 md:gap-3">
        <!-- Dropdown de gêneros -->
        <div class="dropdown relative">
          <button class="dropdown-toggle bg-[#1B4965] text-white px-2 py-1 md:px-4 md:py-2 text-sm md:text-md rounded-lg flex items-center gap-1 md:gap-2">
            <span class="hidden md:inline">Gêneros</span>
            <span>▼</span>
          </button>
          <ul class="dropdown-menu hidden absolute right-0 mt-2 bg-white border-2 border-[#1B4965] rounded-lg shadow-lg py-1 z-50 w-44 md:w-48 text-sm md:text-base">
            <li><a href="genero.html?tipo=acao" class="block px-2 md:px-4 py-1 md:py-2 hover:bg-[#E0F2F1] text-[#1B4965]">Ação</a></li>
            <li><a href="genero.html?tipo=romance" class="block px-2 md:px-4 py-1 md:py-2 hover:bg-[#E0F2F1] text-[#1B4965]">Romance</a></li>
            <li><a href="genero.html?tipo=fantasia" class="block px-2 md:px-4 py-1 md:py-2 hover:bg-[#E0F2F1] text-[#1B4965]">Fantasia</a></li>
            <!-- Adicione os outros gêneros conforme necessário -->
          </ul>
        </div>

        <!-- Botão Minha Lista -->
        <a href="./minha-lista.html" class="bg-[#1B4965] hover:bg-[#123347] text-white rounded-lg flex items-center gap-1 md:gap-2 px-2 py-1 md:px-4 md:py-2">
          Minha Lista
        </a>

        <!-- Botão Perfil -->
        <a href="./perfil.html" class="bg-[#1B4965] hover:bg-[#123347] text-white rounded-lg flex items-center gap-1 md:gap-2 px-2 py-1 md:px-4 md:py-2">
          Perfil
        </a>

        <!-- DESKTOP SEARCH -->
        <div id="desktopSearch" class="hidden md:flex items-center border-2 border-[#1B4965] rounded-lg px-1 py-1 ">
          <input id="searchInput" type="text" placeholder="Buscar livros..." class="bg-transparent outline-none w-40 lg:w-64 text-sm md:text-base px-1 ">
          <button id="searchBtnDesktop" class="bg-[#1B4965] hover:bg-[#123347] p-1 rounded-lg text-white">
            <img src="../img/search.svg" alt="Buscar" class="h-4 md:h-5 filter invert">
          </button>
        </div>

        <!-- MOBILE SEARCH TOGGLE -->
        <div class="md:hidden relative">
          <button id="searchToggleMobile" class="bg-[#1B4965] hover:bg-[#123347] px-2 py-1 rounded-lg text-white flex items-center">
            <img src="../img/search.svg" alt="Buscar" class="h-5 filter invert">
          </button>
          <div id="mobileSearchBox" class="hidden absolute left-1/2 transform -translate-x-1/2 top-full mt-1 w-64 bg-white p-2 rounded-lg shadow z-50">
            <div class="flex gap-2">
              <input id="mobileSearchInput" type="text" placeholder="Buscar livros..." class="flex-1 px-2 py-1 border rounded text-sm">
              <button id="mobileSearchSubmit" class="bg-[#1B4965] hover:bg-[#123347] px-2 md:px-3 py-1 rounded text-white text-sm">Ok</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="max-w-[1350px] mx-auto px-4 py-8">
    <!-- Breadcrumb / título da pesquisa -->
    <div id="breadcrumb" class="text-sm md:text-xl font-semibold text-[#123347] mb-6 flex gap-1 items-center">
      Resultados de pesquisa
    </div>

    <!-- Grid de livros -->
    <div id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>

    <!-- Paginação (opcional futura) -->
    <div class="flex justify-center md:justify-end items-center gap-4 mt-10">
      <button id="prev" class="px-3 py-2 bg-[#1B4965] text-white rounded-lg shadow hover:bg-[#123347]" disabled>Anterior</button>
      <span id="pagina-atual" class="text-sm md:text-base font-medium text-[#123347]">1</span>
      <button id="next" class="px-3 py-2 bg-[#1B4965] text-white rounded-lg shadow hover:bg-[#123347]">Próximo</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-[#1B4965] text-center py-3 font-bold">
    &copy; 2025 InBook. Todos os direitos reservados.
  </footer>

  <!-- Script -->
  <script src="pesquisa.js"></script>
</body>
</html>
