<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InBook | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
  <link rel="stylesheet" href="../index.css">
</head>
<body class="bg-[#E0F2F1] min-h-screen flex items-center justify-center">

  <!-- Container Principal -->
  <div class="flex flex-col lg:flex-row w-full lg:h-screen">
    
    <!-- Lado Esquerdo: Logo -->
    <div class="flex items-center justify-center bg-[#E0F2F1] w-full lg:w-2/5 p-6">
      <img src="../img/logo-Photoroom.png" alt="Logo InBook"
        class="max-w-[200px] sm:max-w-[250px] lg:max-w-[80%] h-auto">
    </div>

    <!-- Lado Direito: Formulário -->
    <div class="flex items-center justify-center bg-[#E0F2F1] w-full lg:w-3/5 p-4">
      <form class="bg-white w-full max-w-md sm:max-w-lg lg:max-w-2xl p-6 sm:p-8 rounded-2xl shadow-lg flex flex-col">
        <h2 class="text-center text-[#1B4965] text-2xl sm:text-3xl font-semibold mb-6">Faça seu login</h2>

        <!-- E-mail -->
        <div class="flex flex-col gap-2 mb-4">
          <label for="emailLogin" class="text-[#1B4965] text-sm sm:text-base font-semibold">E-mail</label>
          <input type="email" id="email" placeholder="Digite seu e-mail" required
            class="w-full px-4 py-3 text-sm sm:text-base border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- Senha -->
        <div class="flex flex-col gap-2 mb-6">
          <label for="senha" class="text-[#1B4965] text-sm sm:text-base font-semibold">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required
            class="w-full px-4 py-3 text-sm sm:text-base border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">

        </div>

        <!-- Botão Entrar -->
        <button type="button" onclick="loginUser()"
          class="w-full py-3 sm:py-4 bg-[#1B4965] hover:bg-[#144256] text-white text-base sm:text-lg font-bold rounded-lg transition">
          Entrar
        </button>

        <!-- Cadastro -->
        <p class="text-sm text-center mt-6">
          Não tem uma conta?
          <a href="#" onclick="openRegisterModal()" class="text-[#1B4965] font-semibold hover:underline">Cadastre-se</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white w-full max-w-md sm:max-w-lg lg:max-w-xl p-6 sm:p-8 rounded-2xl shadow-lg relative max-h-[90vh] overflow-auto">
    <button id="closeRegisterModal" class="absolute top-4 right-4 text-[#1B4965] text-2xl">&times;</button>
      <h2 class="text-center text-[#1B4965] text-2xl sm:text-3xl font-semibold mb-6">Cadastro de Usuário</h2>

      <div id="registerForm" class="flex flex-col gap-4">
        <!-- Nome -->
        <div class="flex flex-col gap-2">
          <label for="registerName" class="text-[#1B4965] font-semibold text-sm sm:text-base">Nome completo</label>
          <input type="text" id="nomeCadastro" placeholder="Digite seu nome completo"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- E-mail -->
        <div class="flex flex-col gap-2">
          <label for="registerEmail" class="text-[#1B4965] font-semibold text-sm sm:text-base">E-mail</label>
          <input type="email" id="emailCadastro" placeholder="Digite seu e-mail"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- CPF -->
        <div class="flex flex-col gap-2">
          <label for="registerCPF" class="text-[#1B4965] font-semibold text-sm sm:text-base">CPF</label>
          <input type="text" id="cpfCadastro" placeholder="Digite seu CPF" maxlength="11"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- Data de nascimento -->
        <div class="flex flex-col gap-2">
          <label for="registerBirthdate" class="text-[#1B4965] font-semibold text-sm sm:text-base">Data de nascimento</label>
          <input type="date" id="dataNascimentoCadastro"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- Senha -->
        <div class="flex flex-col gap-2">
          <label for="registerPassword" class="text-[#1B4965] font-semibold text-sm sm:text-base">Senha</label>
          <input type="password" id="senhaCadastro" placeholder="Digite uma senha"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <!-- Confirmar Senha -->
        <div class="flex flex-col gap-2">
          <label for="confirmRegisterPassword" class="text-[#1B4965] font-semibold text-sm sm:text-base">Confirmar Senha</label>
          <input type="password" id="confirmSenhaCadastro" placeholder="Confirme sua senha"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#1B4965]">
        </div>

        <button onclick="registerUser()"
          class="w-full py-3 sm:py-4 bg-[#1B4965] hover:bg-[#123347] text-white font-bold rounded-lg transition mt-2">
          Cadastrar
        </button>
        <p id="registerMessage" class="text-[#1B4965] text-center text-sm mt-2"></p>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
