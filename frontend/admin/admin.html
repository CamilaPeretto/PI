<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InBook | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
  <link rel="stylesheet" href="../index.css">
</head>
<body class="bg-[#E0F2F1] flex flex-col min-h-screen text-gray-800 ">

  <!-- Navbar -->
  <nav class="bg-[#1B4965] text-white flex justify-between items-center px-8 lg:px-28 py-4 shadow-md">
    <div class="flex items-center space-x-2">
      <i data-lucide="book-open" class="w-6 h-6"></i>
      <span class="font-bold text-lg">InBook Admin</span>
    </div>
    <div class="flex items-center space-x-4">
      <button id="logoutBtn" class="flex items-center gap-1 hover:text-red-400 transition">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        Sair
      </button>
    </div>
  </nav>
  <div class="w-full md:max-w-[1450px] mx-auto px-0 md:px-[52px]">
  <main class="flex-1 px-2 lg:px-24 py-6 space-y-6 flex-grow">
  <!-- Dashboard Cards -->
  <section class="grid md:grid-cols-3 gap-6 p-6">
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Livros Baixados</h3>
        <p class="text-2xl font-bold">1.248</p>
      </div>
      <i data-lucide="download" class="w-8 h-8 text-[#123347]"></i>
    </div>
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Total de Livros</h3>
        <p class="text-2xl font-bold">320</p>
      </div>
      <i data-lucide="book" class="w-8 h-8 text-[#123347]"></i>
    </div>
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Usuários</h3>
        <p class="text-2xl font-bold">580</p>
      </div>
      <i data-lucide="users" class="w-8 h-8 text-[#123347]"></i>
    </div>
  </section>

  <!-- Filtros -->
  <section class="bg-white mx-6 p-5 rounded-2xl shadow">
    <h2 class="font-semibold mb-4 text-lg text-[#1B4965]">Filtros Avançados</h2>
    <div class="grid md:grid-cols-4 gap-4">
      <input type="text" id="filtroTitulo" placeholder="Filtrar por título" class="border rounded-lg p-2 w-full">
      <input type="text" id="filtroAutor" placeholder="Filtrar por autor" class="border rounded-lg p-2 w-full">
      <select id="filtroGenero" class="border rounded-lg p-2 w-full">
        <option value="">Todos os gêneros</option>
          <option>Ação</option>
          <option>Autoajuda</option>
          <option>Aventura</option>
          <option>Biografia</option>
          <option>Clássicos</option>
          <option>Drama</option>
          <option>Fantasia</option>
          <option>Ficção Científica</option>
          <option>História</option>
          <option>Infantil</option>
          <option>Mistério</option>
          <option>Poesia</option>
          <option>Policial</option>
          <option>Psicologia</option>
          <option>Religião</option>
          <option>Romance</option>
          <option>Suspense</option>
          <option>Terror</option>
          <option>Thriller</option>
      </select>
      <select id="filtroFormato" class="border rounded-lg p-2 w-full">
        <option value="">Todos os formatos</option>
        <option>PDF</option>
        <option>EPUB</option>
        <option>MOBI</option>
      </select>

      <div>
        <label class="text-sm text-gray-600">Publicação (de)</label>
        <input type="date" id="dataPubDe" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Publicação (até)</label>
        <input type="date" id="dataPubAte" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Adicionado (de)</label>
        <input type="date" id="dataAddDe" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Adicionado (até)</label>
        <input type="date" id="dataAddAte" class="border rounded-lg p-2 w-full">
      </div>
      
    </div>
    <div class="flex justify-end gap-3 pt-4">
      <button id="btnLimpar" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded">Limpar</button>
      <button id="btnFiltrar" class="bg-[#1B4965] hover:bg-[#173955] text-white px-4 py-2 rounded">Filtrar</button>
    </div>
  </section>

  <!-- Tabela -->
  <section class="bg-white mx-6 mt-6 p-6 rounded-2xl shadow">
  <div class="w-full overflow-x-auto sm:overflow-visible">
    <table class="min-w-full text-left text-sm sm:text-base">
      <thead>
        <tr class="border-b text-[#1B4965]">
          <th class="p-3">Título</th>
          <th class="p-3">Autor</th>
          <th class="p-3">Data de Publicação</th>
          <th class="p-3">Adicionado em</th>
          <th class="p-3">Gênero</th>
          <th class="p-3">Formato</th>
        </tr>
      </thead>
      <tbody id="tabelaLivros" class="divide-y"></tbody>

    </table>
    <div class="text-center mt-4">
      <button id="carregarMais" class="bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Carregar mais</button>
    </div>
  </section>
</main>
  </div>
  <!-- Botão flutuante -->
  <button id="btnAdicionar" class="fixed bottom-16 right-6 bg-[#1B4965] text-white p-4 rounded-full shadow-lg hover:bg-[#163a51] transition flex items-center justify-center">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- Modal Adicionar Livro -->
<div id="modalAdicionar" class="p-4 hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="relative bg-white p-6 w-full max-w-md max-h-[90vh] rounded overflow-auto">
    <!-- Botão X -->
    <button id="fecharModalAdicionar" class="absolute top-3 right-3 text-gray-500 hover:text-black">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <h2 class="text-lg font-semibold mb-4 text-[#1B4965]">Adicionar Novo Livro</h2>

    <form id="formAdicionar" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-600">Título</label>
        <input type="text" id="tituloAdd" placeholder="Título do livro" class="border p-2 rounded w-full" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Autor</label>
        <input type="text" id="autorAdd" placeholder="Autor do livro" class="border p-2 rounded w-full" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Data de Publicação</label>
        <input type="date" id="dataPubAdd" class="border p-2 rounded w-full" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Gênero</label>
        <select id="generoAdd" class="w-full border-gray-300 rounded-lg p-2">
          <option>Ação</option>
          <option>Autoajuda</option>
          <option>Aventura</option>
          <option>Biografia</option>
          <option>Clássicos</option>
          <option>Drama</option>
          <option>Fantasia</option>
          <option>Ficção Científica</option>
          <option>História</option>
          <option>Infantil</option>
          <option>Mistério</option>
          <option>Poesia</option>
          <option>Policial</option>
          <option>Psicologia</option>
          <option>Religião</option>
          <option>Romance</option>
          <option>Suspense</option>
          <option>Terror</option>
          <option>Thriller</option>
          
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Sinopse</label>
        <textarea id="sinopseAdd" rows="3" placeholder="Resumo do livro..." class="border p-2 rounded w-full resize-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Tipo de Arquivo</label>
        <select id="formatoAdd" class="border p-2 rounded w-full">
          <option>PDF</option>
          <option>EPUB</option>
          <option>MOBI</option>
        </select>
      </div>

      <!-- Upload da capa -->
<div>
  <label class="block text-sm font-medium text-gray-600 mb-1">Capa do Livro</label>
  <label for="uploadCapa" 
         class="flex items-center justify-center gap-2 border-2 border-dashed border-gray-300 rounded-xl py-6 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
    <i data-lucide="image" class="w-5 h-5 text-gray-500"></i>
    <span id="labelCapa" class="text-gray-500 text-sm">Selecionar imagem...</span>
  </label>
  <input type="file" id="uploadCapa" accept="image/*" class="hidden">
</div>

<!-- Upload do arquivo -->
<div>
  <label class="block text-sm font-medium text-gray-600 mb-1">Arquivo do Livro</label>
  <label for="uploadArquivo" 
         class="flex items-center justify-center gap-2 border-2 border-dashed border-gray-300 rounded-xl py-6 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
    <i data-lucide="file-text" class="w-5 h-5 text-gray-500"></i>
    <span id="labelArquivo" class="text-gray-500 text-sm">Selecionar arquivo (.pdf, .epub, .mobi)...</span>
  </label>
  <input type="file" id="uploadArquivo" accept=".pdf,.epub,.mobi" class="hidden">
</div>

      <button type="submit" class="bg-[#1B4965] text-white w-full py-2 rounded-lg hover:bg-[#163a51] transition">
        Salvar
      </button>
    </form>
  </div>
</div>

<!-- Modal Detalhes Livro -->
<div id="modalDetalhes" class="p-4 hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded shadow-lg w-[420px] max-h-[90vh] overflow-auto relative">

    <!-- Botão X -->
    <button id="fecharModalDetalhes" class="absolute top-4 right-4 text-gray-500 hover:text-black transition">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <h2 class="text-xl font-semibold mb-5 text-gray-800">Detalhes do Livro</h2>

    <!-- Campos -->
    <div id="detalhesLivro" class="space-y-3 text-sm">

      <div>
        <label class="block text-gray-700 mb-1 font-medium">Título</label>
        <input type="text" id="tituloDetalhe" class="w-full border border-gray-300 rounded-xl p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" readonly>
      </div>

      <div>
        <label class="block text-gray-700 mb-1 font-medium">Autor</label>
        <input type="text" id="autorDetalhe" class="w-full border border-gray-300 rounded-xl p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" readonly>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-gray-700 mb-1 font-medium">Data de Publicação</label>
          <input type="date" id="dataPubDetalhe" class="w-full border border-gray-300 rounded-xl p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" readonly>
        </div>

        <div>
          <label class="block text-gray-700 mb-1 font-medium">Data de Adição</label>
          <input type="date" id="dataAddDetalhe" class="w-full border border-gray-300 rounded-xl p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none" readonly>
        </div>
      </div>

      <div class="flex justify-between text-xs text-gray-500">
        <span id="dataPubInfo"></span>
        <span id="dataAddInfo"></span>
      </div>

      <div>
  <label class="block text-sm font-medium text-gray-600 mb-1">Gênero</label>
  <select id="generoDetalhe" class="border w-full border-gray-300 rounded-lg p-2" disabled>
    <option>Ação</option>
    <option>Autoajuda</option>
    <option>Aventura</option>
    <option>Biografia</option>
    <option>Clássicos</option>
    <option>Drama</option>
    <option>Fantasia</option>
    <option>Ficção Científica</option>
    <option>História</option>
    <option>Infantil</option>
    <option>Mistério</option>
    <option>Poesia</option>
    <option>Policial</option>
    <option>Psicologia</option>
    <option>Religião</option>
    <option>Romance</option>
    <option>Suspense</option>
    <option>Terror</option>
    <option>Thriller</option>
  </select>
</div>

<div>
  <label class="block text-sm font-medium text-gray-600 mb-1">Formato</label>
  <select id="formatoDetalhe" class="border w-full border-gray-300 rounded-lg p-2" disabled>
    <option>PDF</option>
    <option>EPUB</option>
    <option>MOBI</option>
  </select>
</div>


      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Sinopse</label>
        <textarea id="sinopseDetalhe" rows="3" class="w-full border p-2 rounded-xl resize-none" readonly></textarea>
      </div>

      <!-- Upload da capa -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Capa do Livro</label>
        <label for="uploadCapaDetalhe"
               class="flex items-center justify-center gap-2 border-2 border-dashed border-gray-300 rounded-xl py-6 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
          <i data-lucide="image" class="w-5 h-5 text-gray-500"></i>
          <span id="labelCapaDetalhe" class="text-gray-500 text-sm">Selecionar imagem...</span>
        </label>
        <input type="file" id="uploadCapaDetalhe" accept="image/*" class="hidden">
        <img id="previewCapaDetalhe" class="hidden w-32 h-auto mt-2 rounded" alt="Capa do livro">
      </div>

      <!-- Upload do arquivo -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Arquivo do Livro</label>
        <label for="uploadArquivoDetalhe"
               class="flex items-center justify-center gap-2 border-2 border-dashed border-gray-300 rounded-xl py-6 bg-gray-50 hover:bg-gray-100 cursor-pointer transition">
          <i data-lucide="file-text" class="w-5 h-5 text-gray-500"></i>
          <span id="labelArquivoDetalhe" class="text-gray-500 text-sm">Selecionar arquivo (.pdf, .epub, .mobi)...</span>
        </label>
        <input type="file" id="uploadArquivoDetalhe" accept=".pdf,.epub,.mobi" class="hidden">
      </div>

    </div>

    <!-- Botões -->
    <div class="flex justify-between mt-6">
      <button id="editarLivro" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl transition text-sm">Editar</button>
      <button id="salvarEdicao" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl transition text-sm hidden">Salvar</button>
      <button id="deletarLivro" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl transition text-sm">Excluir</button>
    </div>

  </div>
</div>


  <!-- Footer -->
  <footer class="bg-[#1B4965] text-white text-center p-5 mt-10 shadow-md">
    <p class="text-sm">© 2025 InBook Admin. Todos os direitos reservados.</p>
  </footer>
  
  <script src="admin.js"></script>
</body>
</html>
