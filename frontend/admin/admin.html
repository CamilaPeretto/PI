<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Navbar -->
  <nav class="bg-[#1B4965] text-white flex justify-between items-center px-6 py-4 shadow-md">
    <div class="flex items-center space-x-2">
      <i data-lucide="book-open" class="w-6 h-6"></i>
      <span class="font-semibold text-lg">InBook Admin</span>
    </div>
    <div class="flex items-center space-x-4">
      <span>Olá, <strong>Admin</strong></span>
      <button id="logoutBtn" class="flex items-center gap-1 hover:text-red-400 transition">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        Sair
      </button>
    </div>
  </nav>

  <!-- Dashboard Cards -->
  <section class="grid md:grid-cols-3 gap-6 p-6">
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Livros Baixados</h3>
        <p class="text-2xl font-bold">1.248</p>
      </div>
      <i data-lucide="download" class="w-8 h-8 text-blue-500"></i>
    </div>
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Total de Livros</h3>
        <p class="text-2xl font-bold">320</p>
      </div>
      <i data-lucide="book" class="w-8 h-8 text-green-500"></i>
    </div>
    <div class="bg-white p-5 rounded-2xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-500 text-sm">Usuários</h3>
        <p class="text-2xl font-bold">580</p>
      </div>
      <i data-lucide="users" class="w-8 h-8 text-purple-500"></i>
    </div>
  </section>

  <!-- Filtros -->
  <section class="bg-white mx-6 p-5 rounded-2xl shadow">
    <h2 class="font-semibold mb-4 text-lg">Filtros Avançados</h2>
    <div class="grid md:grid-cols-4 gap-4">
      <input type="text" id="filtroTitulo" placeholder="Filtrar por título" class="border rounded-lg p-2 w-full">
      <input type="text" id="filtroAutor" placeholder="Filtrar por autor" class="border rounded-lg p-2 w-full">
      <select id="filtroGenero" class="border rounded-lg p-2 w-full">
        <option value="">Todos os gêneros</option>
        <option>Romance</option>
        <option>Ficção</option>
        <option>Aventura</option>
        <option>Fantasia</option>
        <option>Terror</option>
      </select>
      <select id="filtroFormato" class="border rounded-lg p-2 w-full">
        <option value="">Todos os formatos</option>
        <option>PDF</option>
        <option>EPUB</option>
        <option>MOBI</option>
      </select>

      <div>
        <label class="text-sm text-gray-600">Publicação (de)</label>
        <input type="date" id="dataPubDe" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Publicação (até)</label>
        <input type="date" id="dataPubAte" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Adicionado (de)</label>
        <input type="date" id="dataAddDe" class="border rounded-lg p-2 w-full">
      </div>
      <div>
        <label class="text-sm text-gray-600">Adicionado (até)</label>
        <input type="date" id="dataAddAte" class="border rounded-lg p-2 w-full">
      </div>
    </div>
  </section>

  <!-- Tabela -->
  <section class="bg-white mx-6 mt-6 p-6 rounded-2xl shadow overflow-x-auto">
    <table class="min-w-full text-left">
      <thead>
        <tr class="border-b">
          <th class="p-3">Título</th>
          <th class="p-3">Autor</th>
          <th class="p-3">Data de Publicação</th>
          <th class="p-3">Adicionado em</th>
          <th class="p-3">Gênero</th>
          <th class="p-3">Formato</th>
        </tr>
      </thead>
      <tbody id="tabelaLivros" class="divide-y"></tbody>
    </table>
    <div class="text-center mt-4">
      <button id="carregarMais" class="bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Carregar mais</button>
    </div>
  </section>

  <!-- Botão flutuante -->
  <button id="btnAdicionar" class="fixed bottom-6 right-6 bg-[#1B4965] text-white p-4 rounded-full shadow-lg hover:bg-[#163a51] transition flex items-center justify-center">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- Modal Adicionar Livro -->
  <div id="modalAdicionar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-96">
      <h2 class="text-lg font-semibold mb-4">Adicionar Novo Livro</h2>
      <form id="formAdicionar" class="space-y-3">
        <input type="text" id="tituloAdd" placeholder="Título" class="border p-2 rounded w-full" required>
        <input type="text" id="autorAdd" placeholder="Autor" class="border p-2 rounded w-full" required>
        <input type="date" id="dataPubAdd" class="border p-2 rounded w-full" required>
        <select id="generoAdd" class="border p-2 rounded w-full">
          <option>Romance</option>
          <option>Ficção</option>
          <option>Aventura</option>
          <option>Fantasia</option>
          <option>Terror</option>
        </select>
        <select id="formatoAdd" class="border p-2 rounded w-full">
          <option>PDF</option>
          <option>EPUB</option>
          <option>MOBI</option>
        </select>
        <button type="submit" class="bg-[#1B4965] text-white w-full py-2 rounded-lg hover:bg-[#163a51]">Salvar</button>
      </form>
      <button id="fecharModalAdicionar" class="mt-3 text-sm text-gray-600 hover:text-black">Cancelar</button>
    </div>
  </div>

  <!-- Modal Detalhes Livro -->
  <div id="modalDetalhes" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-96">
      <h2 class="text-lg font-semibold mb-4">Detalhes do Livro</h2>
      <div id="detalhesLivro" class="space-y-2 text-sm"></div>
      <button id="fecharModalDetalhes" class="mt-3 text-sm text-gray-600 hover:text-black">Fechar</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const generos = ["Romance", "Ficção", "Aventura", "Fantasia", "Terror"];
    const formatos = ["PDF", "EPUB", "MOBI"];
    const livros = Array.from({ length: 50 }, (_, i) => ({
      titulo: `Livro ${i + 1}`,
      autor: `Autor ${i + 1}`,
      publicacao: `20${10 + (i % 14)}-${String((i % 9) + 1).padStart(2, "0")}-15`,
      adicionado: `2025-10-${String((i % 28) + 1).padStart(2, "0")}`,
      genero: generos[i % generos.length],
      formato: formatos[i % formatos.length]
    }));

    let mostrados = 10;
    const tabela = document.getElementById("tabelaLivros");

    const renderTabela = (lista) => {
      tabela.innerHTML = "";
      lista.slice(0, mostrados).forEach(l => {
        const tr = document.createElement("tr");
        tr.classList.add("hover:bg-gray-100", "cursor-pointer");
        tr.innerHTML = `
          <td class="p-3">${l.titulo}</td>
          <td class="p-3">${l.autor}</td>
          <td class="p-3">${l.publicacao}</td>
          <td class="p-3">${l.adicionado}</td>
          <td class="p-3">${l.genero}</td>
          <td class="p-3">${l.formato}</td>`;
        tr.onclick = () => abrirDetalhes(l);
        tabela.appendChild(tr);
      });
    };
    renderTabela(livros);

    // Carregar mais
    document.getElementById("carregarMais").onclick = () => {
      mostrados += 10;
      aplicarFiltros();
    };

    // Filtros
    const filtros = [
      "filtroTitulo", "filtroAutor", "filtroGenero", "filtroFormato",
      "dataPubDe", "dataPubAte", "dataAddDe", "dataAddAte"
    ];
    filtros.forEach(id => document.getElementById(id).addEventListener("input", aplicarFiltros));

    function aplicarFiltros() {
      let filtrados = livros.filter(l => {
        const t = document.getElementById("filtroTitulo").value.toLowerCase();
        const a = document.getElementById("filtroAutor").value.toLowerCase();
        const g = document.getElementById("filtroGenero").value;
        const f = document.getElementById("filtroFormato").value;
        const pubDe = document.getElementById("dataPubDe").value;
        const pubAte = document.getElementById("dataPubAte").value;
        const addDe = document.getElementById("dataAddDe").value;
        const addAte = document.getElementById("dataAddAte").value;

        const matchTitulo = l.titulo.toLowerCase().includes(t);
        const matchAutor = l.autor.toLowerCase().includes(a);
        const matchGenero = !g || l.genero === g;
        const matchFormato = !f || l.formato === f;

        const pubOk = (!pubDe || l.publicacao >= pubDe) && (!pubAte || l.publicacao <= pubAte);
        const addOk = (!addDe || l.adicionado >= addDe) && (!addAte || l.adicionado <= addAte);

        return matchTitulo && matchAutor && matchGenero && matchFormato && pubOk && addOk;
      });

      renderTabela(filtrados);
    }

    // Modais
    const modalAdicionar = document.getElementById("modalAdicionar");
    const modalDetalhes = document.getElementById("modalDetalhes");
    const detalhesLivro = document.getElementById("detalhesLivro");

    document.getElementById("btnAdicionar").onclick = () => modalAdicionar.classList.remove("hidden");
    document.getElementById("fecharModalAdicionar").onclick = () => modalAdicionar.classList.add("hidden");

    const abrirDetalhes = (l) => {
      detalhesLivro.innerHTML = `
        <p><strong>Título:</strong> ${l.titulo}</p>
        <p><strong>Autor:</strong> ${l.autor}</p>
        <p><strong>Publicação:</strong> ${l.publicacao}</p>
        <p><strong>Adicionado em:</strong> ${l.adicionado}</p>
        <p><strong>Gênero:</strong> ${l.genero}</p>
        <p><strong>Formato:</strong> ${l.formato}</p>`;
      modalDetalhes.classList.remove("hidden");
    };
    document.getElementById("fecharModalDetalhes").onclick = () => modalDetalhes.classList.add("hidden");
  </script>
</body>
</html>
