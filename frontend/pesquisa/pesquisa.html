<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InBook | Pesquisa de Livros</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../index.css">
</head>
<body class="bg-[#E0F2F1]">

  <!-- NAVBAR  -->
  <nav class="w-full bg-white shadow-md">
    <div class="w-full md:max-w-[1450px] mx-auto flex items-center justify-between px-2 md:px-[52px] py-3 md:py-4">
      <a href="../home/home.html" class="flex-shrink-0">
        <img src="../img/logo-Photoroom-home.png" alt="Logo InBook" class="w-20 md:w-32">
      </a>

      <div class="flex items-center gap-2 md:gap-3">
        <!-- DESKTOP SEARCH -->
        <div id="desktopSearch" class="hidden md:flex items-center border-2 border-[#1B4965] rounded-lg px-1 py-1">
          <input id="searchInput" type="text" placeholder="Buscar livros..." class="bg-transparent outline-none w-40 lg:w-64 text-sm md:text-base px-1">
          <button id="searchBtnDesktop" class="bg-[#1B4965] hover:bg-[#123347] p-1 rounded-lg text-white">
            <img src="../img/search.svg" alt="Buscar" class="h-4 md:h-5 filter invert">
          </button>
        </div>

        <!-- MOBILE SEARCH -->
        <div class="md:hidden relative">
          <button id="searchToggleMobile" class="bg-[#1B4965] hover:bg-[#123347] px-2 py-1 rounded-lg text-white flex items-center">
            <img src="../img/search.svg" alt="Buscar" class="h-5 filter invert">
          </button>
          <div id="mobileSearchBox" class="hidden absolute left-1/2 transform -translate-x-1/2 top-full mt-1 w-64 bg-white p-2 rounded-lg shadow z-50">
            <div class="flex gap-2">
              <input id="mobileSearchInput" type="text" placeholder="Buscar livros..." class="flex-1 px-2 py-1 border rounded text-sm">
              <button id="mobileSearchSubmit" class="bg-[#1B4965] hover:bg-[#123347] px-2 md:px-3 py-1 rounded text-white text-sm">Ok</button>
            </div>
          </div>
        </div>

        <!-- Botão Perfil do Leitor -->
        <a href="../perfil/perfil.html" class="bg-[#1B4965] hover:bg-[#123347] text-white rounded-lg flex items-center gap-1 md:gap-2 px-2 py-1 md:px-4 md:py-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="lucide lucide-user h-5 w-5 md:h-6 md:w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <button id="logoutBtn" class="bg-[#1B4965] hover:bg-[#123347] text-white rounded-lg flex items-center gap-1 md:gap-2 px-2 py-1 md:px-4 md:py-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 md:h-6 md:w-7">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
      </div>
    </div>
  </div>
</nav>

<div class="flex flex-col min-h-screen">
  <!-- Conteúdo principal -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-8">
    <!-- Breadcrumb -->
    <div id="breadcrumb" class="text-sm md:text-lg font-semibold text-[#123347] mb-6 flex gap-1 items-center"></div>

    <!-- Resultados da pesquisa -->
    <h1 id="searchTitle" class="text-md md:text-lg font-bold text-[#123347] mb-6"></h1>
      <div
        id="searchResults"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"
      >
        <!-- Cards serão injetados aqui via JS -->
      </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white text-[#1B4965] mt-16 shadow-lg">
    <div class="max-w-[1450px] mx-auto px-3 py-6 flex flex-col items-center text-center gap-6">
      
      <!-- Logo -->
      <img src="../img/logo-Photoroom-home.png" alt="InBook Logo" class="w-20 md:w-32 drop-shadow-md">
  
      <!-- Frase -->
      <p class="text-sm md:text-base text-[#1B4965] leading-relaxed">
        Descubra, leia e compartilhe histórias que inspiram.
        Seu universo literário começa aqui.
      </p>
  
      <!-- Linha -->
      <div class="w-24 h-[2px] bg-[#1B4965] rounded-full"></div>
  
      <!-- Copyright -->
      <p class="text-xs md:text-sm text-[#1B4965] font-medium">
        &copy; 2025 <span class="font-semibold text-[#1B4965]">InBook</span>. Todos os direitos reservados.
      </p>
    </div>
  </footer>  

</div>
<!-- Container do Modal -->
<div id="modal-container"></div>

<script>
  fetch("../modalAbrirModal/modalLivro.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("modal-container").innerHTML = html;
      const script = document.createElement("script");
      script.src = "../modalAbrirModal/modalLivro.js";
      document.body.appendChild(script);
    });
</script>
  <!-- Script -->
  <script src="pesquisa.js"></script>
</body>
</html>
